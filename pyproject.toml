[project]
name = "goskills"
version = "0.1.0"
description = "Group-structured skill retrieval for agent skill libraries."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
goskills-query = "goskills.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["goskills*", "gos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
